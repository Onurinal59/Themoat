<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404: Page Not Found | Economic Moat Academy</title>
  <meta name="description" content="The page you are looking for does not exist. Return to Economic Moat Academy." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(30, 41, 59, 0.6);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --badge-bg: rgba(99, 102, 241, 0.15);
      --badge-border: rgba(99, 102, 241, 0.3);
      --badge-text: #a5b4fc;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --badge-bg: #e0e7ff;
        --badge-border: #c7d2fe;
        --badge-text: #4338ca;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(12px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.875rem;
      border-radius: 9999px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--badge-text);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .error-code {
      font-size: 4.5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 0.75rem;
      transition: background-color 0.15s ease, transform 0.15s ease;
      min-height: 44px;
      width: 100%;
    }
    .btn:hover, .btn:focus {
      background: var(--accent-hover);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      transform: translateY(-1px);
    }
    .footer-note {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <div class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
      </svg>
      Economic Moat Academy
    </div>
    
    <div class="error-code" aria-hidden="true">404</div>
    <h1>Page Not Found</h1>
    <p>
      The page or financial analysis asset you are looking for does not exist, has been moved, or the URL might be mistyped.
    </p>

    <a href="/" class="btn" id="btn-back-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Back to Academy
    </a>

    <div class="footer-note">
      Measuring the Moat • ROIC • Valuation Framework
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      try {
        var locale = localStorage.getItem("economicMoatLocale");
        if (locale === "tr") {
          document.documentElement.lang = "tr";
          document.title = "404: Sayfa Bulunamadı | Economic Moat Academy";
          document.querySelector("h1").textContent = "Sayfa Bulunamadı";
          document.querySelector("p").textContent = "Aradığınız sayfa veya finansal analiz aracı mevcut değil, taşınmış olabilir veya URL yanlış yazılmış olabilir.";
          
          var btn = document.getElementById("btn-back-home");
          btn.innerHTML = btn.innerHTML.replace("Back to Academy", "Akademiye Dön");
          
          document.querySelector(".footer-note").textContent = "Hendek Ölçümü • ROIC • Değerleme Çerçevesi";
        }
      } catch (e) {
        // ignore
      }
    });
  </script>

</body>
</html>
